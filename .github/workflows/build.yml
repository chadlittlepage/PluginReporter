name: Build and Test Plugin Reporter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          .build
        key: spm-macos-${{ hashFiles('PluginReporter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          spm-macos-

    - name: Build macOS app
      run: |
        BUILD_START=$SECONDS
        set -o pipefail
        xcodebuild -scheme "PR MAC" \
          -configuration Release \
          -destination 'platform=macOS' \
          -derivedDataPath ./build \
          build 2>&1 | xcpretty
        BUILD_DURATION=$(( SECONDS - BUILD_START ))
        echo "build_duration=$BUILD_DURATION" >> $GITHUB_OUTPUT
        echo "## macOS Build" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: ${BUILD_DURATION}s" >> $GITHUB_STEP_SUMMARY

    - name: Track build size
      run: |
        APP_SIZE=$(du -sh build/Build/Products/Release/*.app | awk '{print $1}')
        echo "macOS App Size: $APP_SIZE"
        echo "- App size: $APP_SIZE" >> $GITHUB_STEP_SUMMARY

    - name: Upload macOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-macOS
        path: build/Build/Products/Release/PluginReporter.app
        retention-days: 30

    - name: Upload dSYMs
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-macOS-dSYMs
        path: build/Build/Products/Release/*.dSYM
        retention-days: 90
        if-no-files-found: warn

  build-ios:
    name: Build iOS App
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          .build
        key: spm-ios-${{ hashFiles('PluginReporter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          spm-ios-

    - name: Build iOS app (simulator)
      run: |
        BUILD_START=$SECONDS
        set -o pipefail
        xcodebuild -scheme "PR iPHONE" \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          build 2>&1 | xcpretty
        BUILD_DURATION=$(( SECONDS - BUILD_START ))
        echo "## iOS Build" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: ${BUILD_DURATION}s" >> $GITHUB_STEP_SUMMARY

    - name: Upload iOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-iOS
        path: build/Build/Products/Debug-iphonesimulator/
        retention-days: 30

  test:
    name: Run Tests
    runs-on: macos-14
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          .build
        key: spm-test-${{ hashFiles('PluginReporter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          spm-test-

    - name: Run tests
      run: |
        # Currently no tests - this will be ready when you add them
        echo "No tests to run yet - add XCTest files to enable testing"
        echo "## Tests" >> $GITHUB_STEP_SUMMARY
        echo "- Status: No test targets yet" >> $GITHUB_STEP_SUMMARY
        # xcodebuild test -scheme PluginReporter -destination 'platform=macOS' 2>&1 | xcpretty

  lint:
    name: Code Quality
    runs-on: macos-14
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: |
        swiftlint lint --strict --reporter github-actions-logging
        echo "## Code Quality" >> $GITHUB_STEP_SUMMARY
        echo "- SwiftLint: Passed" >> $GITHUB_STEP_SUMMARY

    - name: Count lines of code
      run: |
        SWIFT_FILES=$(find . -name '*.swift' -not -path './.build/*' -not -path './build/*' | wc -l | tr -d ' ')
        LOC=$(find . -name '*.swift' -not -path './.build/*' -not -path './build/*' -exec wc -l {} + | tail -1 | awk '{print $1}')
        echo "- Swift files: $SWIFT_FILES" >> $GITHUB_STEP_SUMMARY
        echo "- Lines of code: $LOC" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: macos-14
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-ios, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto-increment build number
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Release version: $VERSION"
        find . -name "Info.plist" -not -path "./build/*" | while read plist; do
          if [ -f "$plist" ]; then
            echo "Updating build number in: $plist"
          fi
        done

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-macOS
        path: ./release/macOS

    - name: Download iOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-iOS
        path: ./release/iOS

    - name: Download macOS dSYMs
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-macOS-dSYMs
        path: ./release/dSYMs
      continue-on-error: true

    - name: Upload dSYMs to Sentry
      if: env.SENTRY_AUTH_TOKEN != ''
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
        SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      run: |
        if [ -d "./release/dSYMs" ]; then
          brew install getsentry/tools/sentry-cli
          sentry-cli debug-files upload --include-sources ./release/dSYMs
          echo "## Sentry" >> $GITHUB_STEP_SUMMARY
          echo "- dSYMs uploaded successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "No dSYMs found to upload"
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/macOS/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
