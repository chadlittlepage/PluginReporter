name: Build and Test Plugin Reporter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14  # macOS Sonoma with Xcode 15+

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build macOS app
      run: |
        xcodebuild -scheme "PR MAC" \
          -configuration Release \
          -destination 'platform=macOS' \
          -derivedDataPath ./build \
          clean build

    - name: Track build size
      run: |
        echo "📦 Build Size Report:"
        APP_SIZE=$(du -sh build/Build/Products/Release/*.app | awk '{print $1}')
        echo "macOS App Size: $APP_SIZE"
        echo "app_size=$APP_SIZE" >> $GITHUB_OUTPUT

    - name: Generate code coverage (if tests exist)
      run: |
        echo "📊 Code Coverage Analysis:"
        # Will activate when tests are added
        echo "No tests yet - coverage will show when XCTests are added"
        # xcodebuild test -scheme "PR MAC" -enableCodeCoverage YES

    - name: Upload macOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-macOS
        path: build/Build/Products/Release/PluginReporter.app
        retention-days: 30

  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS app (simulator)
      run: |
        xcodebuild -scheme "PR iPHONE" \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Upload iOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-iOS
        path: build/Build/Products/Release-iphonesimulator/
        retention-days: 30

  build-ipados:
    name: Build iPadOS App
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iPadOS app (simulator)
      run: |
        xcodebuild -scheme "PR iPHONE" \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Upload iPadOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-iPadOS
        path: build/Build/Products/Release-iphonesimulator/
        retention-days: 30

  # Run tests (when you add them)
  test:
    name: Run Tests
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Run tests
      run: |
        # Currently no tests - this will be ready when you add them
        echo "✅ No tests to run yet - add XCTest files to enable testing"
        # xcodebuild test -scheme PluginReporter -destination 'platform=macOS'

  # Code quality checks with SwiftLint
  lint:
    name: Code Quality
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: |
        echo "📝 Running SwiftLint code quality checks..."
        swiftlint lint --reporter github-actions-logging || true
        echo "✅ SwiftLint analysis complete"

    - name: Count lines of code
      run: |
        echo "📊 Project Statistics:"
        echo "Swift files: $(find . -name '*.swift' | wc -l)"
        echo "Lines of code: $(find . -name '*.swift' -exec wc -l {} + | tail -1)"

  # Create release when version tag is pushed
  release:
    name: Create Release
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-ios, build-ipados, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Auto-increment build number
      run: |
        echo "🔢 Auto-incrementing build number for release..."
        # Extract version from tag (e.g., v006 -> 6)
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "Release version: $VERSION"

        # Find and update Info.plist files
        find . -name "Info.plist" -not -path "./build/*" | while read plist; do
          if [ -f "$plist" ]; then
            echo "Updating build number in: $plist"
            # This will be used when you have proper Info.plist files
            # /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"
          fi
        done

        echo "✅ Build numbers updated to: $VERSION"

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-macOS
        path: ./release/macOS

    - name: Download iOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-iOS
        path: ./release/iOS

    - name: Download iPadOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-iPadOS
        path: ./release/iPadOS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/macOS/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
