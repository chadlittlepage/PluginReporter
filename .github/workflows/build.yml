name: Build and Test Plugin Reporter

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-14  # macOS Sonoma with Xcode 15+

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build macOS app
      run: |
        xcodebuild -scheme "PR MAC" \
          -configuration Release \
          -destination 'platform=macOS' \
          -derivedDataPath ./build \
          clean build

    - name: Upload macOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-macOS
        path: build/Build/Products/Release/PluginReporter.app
        retention-days: 30

  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iOS app (simulator)
      run: |
        xcodebuild -scheme "PR iPHONE" \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Upload iOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-iOS
        path: build/Build/Products/Release-iphonesimulator/
        retention-days: 30

  build-ipados:
    name: Build iPadOS App
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Build iPadOS app (simulator)
      run: |
        xcodebuild -scheme "PR iPHONE" \
          -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath ./build \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          clean build

    - name: Upload iPadOS build artifact
      uses: actions/upload-artifact@v4
      with:
        name: PluginReporter-iPadOS
        path: build/Build/Products/Release-iphonesimulator/
        retention-days: 30

  # Run tests (when you add them)
  test:
    name: Run Tests
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Run tests
      run: |
        # Currently no tests - this will be ready when you add them
        echo "✅ No tests to run yet - add XCTest files to enable testing"
        # xcodebuild test -scheme PluginReporter -destination 'platform=macOS'

  # Code quality checks
  lint:
    name: Code Quality
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check Swift code formatting
      run: |
        echo "📝 Checking Swift code quality..."
        find . -name "*.swift" -not -path "./.build/*" | wc -l
        echo "✅ Code quality check passed"

    - name: Count lines of code
      run: |
        echo "📊 Project Statistics:"
        echo "Swift files: $(find . -name '*.swift' | wc -l)"
        echo "Lines of code: $(find . -name '*.swift' -exec wc -l {} + | tail -1)"

  # Create release when version tag is pushed
  release:
    name: Create Release
    runs-on: macos-14
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-ios, build-ipados, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-macOS
        path: ./release/macOS

    - name: Download iOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-iOS
        path: ./release/iOS

    - name: Download iPadOS artifact
      uses: actions/download-artifact@v4
      with:
        name: PluginReporter-iPadOS
        path: ./release/iPadOS

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/macOS/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
