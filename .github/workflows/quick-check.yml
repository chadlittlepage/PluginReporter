name: Quick Check

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-build:
    name: Quick Build Check
    runs-on: macos-14
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Show environment
      run: |
        sw_vers
        xcodebuild -version
        SWIFT_FILES=$(find . -name '*.swift' -not -path './.build/*' -not -path './build/*' | wc -l | tr -d ' ')
        echo "Swift files: $SWIFT_FILES"

    - name: Cache SPM packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm
          ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          .build
        key: spm-quick-${{ hashFiles('PluginReporter.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
        restore-keys: |
          spm-quick-

    - name: Build macOS (syntax check)
      run: |
        BUILD_START=$SECONDS
        set -o pipefail
        xcodebuild -scheme "PR MAC" \
          -destination 'platform=macOS' \
          -configuration Debug \
          build 2>&1 | xcpretty
        BUILD_DURATION=$(( SECONDS - BUILD_START ))
        echo "## Quick Check" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: ${BUILD_DURATION}s" >> $GITHUB_STEP_SUMMARY
        echo "- Status: Passed" >> $GITHUB_STEP_SUMMARY
