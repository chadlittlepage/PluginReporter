# SwiftLint Configuration for Plugin Reporter
# Professional code quality standards

# Paths to include/exclude
included:
  - PluginReporter

excluded:
  - Pods
  - .build
  - build
  - DerivedData

# Disable rules that don't fit your style
disabled_rules:
  - trailing_whitespace # You can enable this if you want stricter whitespace rules

# Opt-in rules (best practices)
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_imports

# Rule configurations
line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 50
  error: 100

type_body_length:
  warning: 300
  error: 500

# Naming rules
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 50
    error: 60
  excluded:
    - id
    - x
    - y
    - z

# Custom rules for your project
custom_rules:
  no_print_in_release:
    name: "No print() in production"
    regex: "print\\("
    message: "Use proper logging instead of print()"
    severity: warning
