# SwiftLint Configuration for Plugin Reporter
# Production-ready quality standards

# Paths to include/exclude
included:
  - .

excluded:
  - Pods
  - .build
  - build
  - DerivedData
  - fastlane
  - .swiftpm
  - SourcePackages
  - firebase/functions               # Firebase functions (separate project)
  - PluginFormatDatabase.swift      # Generated data file
  - PluginHeritageDatabase.swift    # Generated data file
  - DAWPlaylistManager.swift        # Large data structures
  - ReasonParser.swift              # Large embedded data

# Disable rules that don't apply to production apps
disabled_rules:
  - trailing_whitespace
  - file_length              # Complex apps have large view files
  - type_body_length         # UI views can be complex
  - function_body_length     # View builders and parsers can be long
  - cyclomatic_complexity    # Parsers have complex logic
  - large_tuple              # Used for internal data structures
  - multiple_closures_with_trailing_closure  # SwiftUI pattern
  - line_length              # Data structures can be wide
  - force_cast               # Safe in controlled environments
  - force_try                # Safe for known operations
  - type_name                # Custom platform naming conventions
  - identifier_name          # Allow flexible naming (single letters in loops/math)
  - for_where                # Style preference
  - nesting                  # Complex data structures require nesting
  - switch_case_alignment    # Style preference
  - unused_optional_binding  # Sometimes intentional
  - inclusive_language        # Audio industry standard terms (mastering)

# Opt-in rules (best practices)
opt_in_rules:
  - empty_count
  - empty_string
  - closure_spacing
  - contains_over_filter_count
  - discouraged_optional_boolean
  - first_where
  - last_where

# Rule-specific overrides
todo:
  severity: warning          # Flag TODOs but don't block builds
